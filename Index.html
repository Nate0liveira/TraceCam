<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TraceCam</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body {
    height:100%;
    height:100dvh;
    overflow:hidden;
    background:#000;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  }

  #stage { position:fixed; inset:0; overflow:hidden; touch-action:none; }

  video#cam { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

  #overlayWrap { position:absolute; top:50%; left:50%; width:0; height:0; }
  #overlayImg {
    position:absolute; top:0; left:0;
    transform-origin:center center;
    max-width:none;
    pointer-events:none;
    opacity:0.5;
    display:none;
  }

  #startScreen {
    position:fixed; inset:0; background:#0b0b0d; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:32px; text-align:center; z-index:50;
  }
  #startScreen h1 { font-size:22px; font-weight:600; }
  #startScreen p { font-size:14px; color:#a8a8ad; max-width:320px; line-height:1.4; }
  .bigBtn {
    background:#ffcc33; color:#111; border:none; border-radius:14px;
    padding:14px 28px; font-size:16px; font-weight:600; cursor:pointer;
  }
  .bigBtn:active { opacity:0.8; }
  #errMsg { color:#ff6b6b; font-size:13px; max-width:300px; }

  #langToggleStart {
    position:absolute; top:calc(14px + env(safe-area-inset-top)); right:14px;
    background:#2c2c2e; color:#fff; border:none; border-radius:8px;
    padding:6px 10px; font-size:12px; font-weight:600;
  }

  /* Bottom control bar — kept compact so the camera view gets max space */
  #bar {
    position:fixed; left:0; right:0; bottom:0;
    background:rgba(20,20,22,0.72);
    backdrop-filter: blur(14px);
    padding:6px 12px calc(8px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:6px;
    z-index:20;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  #bar.hidden { transform:translateY(100%); opacity:0; pointer-events:none; }

  .row { display:flex; align-items:center; gap:8px; }
  .row label { color:#e6e6e6; font-size:11px; width:52px; flex-shrink:0; }
  input[type=range] { flex:1; accent-color:#ffcc33; height:20px; }

  #btnRow { display:flex; gap:6px; justify-content:space-between; }
  .ctrlBtn {
    flex:1; background:#2c2c2e; color:#fff; border:none; border-radius:9px;
    padding:8px 4px; font-size:11px; font-weight:500; text-align:center;
  }
  .ctrlBtn.active { background:#ffcc33; color:#111; }
  .ctrlBtn:active { opacity:0.7; }

  #fileInput { display:none; }

  #peekTab {
    position:fixed; right:10px; bottom:calc(10px + env(safe-area-inset-bottom));
    width:38px; height:38px; border-radius:19px;
    background:rgba(20,20,22,0.75); color:#fff;
    display:none; align-items:center; justify-content:center;
    font-size:17px; z-index:21;
  }
  #peekTab.show { display:flex; }

  #hint {
    position:fixed; top:calc(8px + env(safe-area-inset-top)); left:0; right:0;
    text-align:center; color:#fff; font-size:11px; opacity:0.85;
    text-shadow:0 1px 3px rgba(0,0,0,0.8); z-index:15; pointer-events:none;
    display:none;
  }
</style>
</head>
<body>

<div id="startScreen">
  <button id="langToggleStart">ES</button>
  <h1 data-i18n="title">TraceCam</h1>
  <p data-i18n="intro">Point your camera at the surface you want to draw on, load a reference image, then resize, move and dim it until it lines up. Trace away.</p>
  <button class="bigBtn" id="startBtn" data-i18n="enableCam">Enable Camera</button>
  <p id="errMsg"></p>
</div>

<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <div id="overlayWrap">
    <img id="overlayImg" alt="reference">
  </div>
</div>

<div id="hint" data-i18n="hint">Pinch to resize · drag to move · two-finger twist to rotate</div>

<div id="peekTab">☰</div>

<div id="bar">
  <div class="row">
    <label data-i18n="opacity">Opacity</label>
    <input type="range" id="opacitySlider" min="5" max="95" value="50">
    <button class="ctrlBtn" id="langToggleBar" style="flex:0 0 40px;">ES</button>
  </div>
  <div id="btnRow">
    <button class="ctrlBtn" id="loadBtn" data-i18n="loadImage">Load Image</button>
    <button class="ctrlBtn" id="lockBtn" data-i18n="lock">Lock</button>
    <button class="ctrlBtn" id="flipBtn" data-i18n="mirror">Mirror</button>
    <button class="ctrlBtn" id="hideBtn" data-i18n="hideBar">Hide Bar</button>
  </div>
  <input type="file" id="fileInput" accept="image/*">
</div>

<script>
(function(){
  const I18N = {
    en: {
      title: 'TraceCam',
      intro: 'Point your camera at the surface you want to draw on, load a reference image, then resize, move and dim it until it lines up. Trace away.',
      enableCam: 'Enable Camera',
      hint: 'Pinch to resize · drag to move · two-finger twist to rotate',
      opacity: 'Opacity',
      loadImage: 'Load Image',
      lock: 'Lock',
      unlock: 'Unlock',
      mirror: 'Mirror',
      hideBar: 'Hide Bar',
      camErrPrefix: 'Could not access camera: ',
      camErrSuffix: '. Check Settings > Safari > Camera.'
    },
    es: {
      title: 'TraceCam',
      intro: 'Apunta la cámara a la superficie donde quieres dibujar, carga una imagen de referencia, luego ajusta el tamaño, muévela y atenúala hasta que encaje. Y a calcar.',
      enableCam: 'Activar cámara',
      hint: 'Pellizca para ajustar el tamaño · arrastra para mover · gira con dos dedos para rotar',
      opacity: 'Opacidad',
      loadImage: 'Cargar imagen',
      lock: 'Bloquear',
      unlock: 'Desbloquear',
      mirror: 'Espejo',
      hideBar: 'Ocultar barra',
      camErrPrefix: 'No se pudo acceder a la cámara: ',
      camErrSuffix: '. Revisa Ajustes > Safari > Cámara.'
    }
  };
  let lang = 'en';

  function applyLanguage(){
    const t = I18N[lang];
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const key = el.getAttribute('data-i18n');
      if(t[key] !== undefined) el.textContent = t[key];
    });
    lockBtn.textContent = state.locked ? t.unlock : t.lock;
    langToggleStart.textContent = lang === 'en' ? 'ES' : 'EN';
    langToggleBar.textContent = lang === 'en' ? 'ES' : 'EN';
  }

  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');
  const errMsg = document.getElementById('errMsg');
  const cam = document.getElementById('cam');
  const overlayImg = document.getElementById('overlayImg');
  const stage = document.getElementById('stage');
  const opacitySlider = document.getElementById('opacitySlider');
  const loadBtn = document.getElementById('loadBtn');
  const fileInput = document.getElementById('fileInput');
  const lockBtn = document.getElementById('lockBtn');
  const flipBtn = document.getElementById('flipBtn');
  const hideBtn = document.getElementById('hideBtn');
  const bar = document.getElementById('bar');
  const peekTab = document.getElementById('peekTab');
  const hint = document.getElementById('hint');
  const langToggleStart = document.getElementById('langToggleStart');
  const langToggleBar = document.getElementById('langToggleBar');

  let state = { x:0, y:0, scale:1, rotate:0, locked:false, mirrored:false };
  let imgLoaded = false;

  function applyTransform(){
    overlayImg.style.transform =
      `translate(-50%,-50%) translate(${state.x}px, ${state.y}px) scale(${state.mirrored?-1:1} , 1) scale(${state.scale}) rotate(${state.rotate}deg)`;
  }

  function toggleLang(){
    lang = lang === 'en' ? 'es' : 'en';
    applyLanguage();
  }
  langToggleStart.addEventListener('click', toggleLang);
  langToggleBar.addEventListener('click', toggleLang);

  // ---- Camera setup ----
  async function startCamera(){
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width:{ideal:1920}, height:{ideal:1080} },
        audio: false
      });
      cam.srcObject = stream;
      startScreen.style.display = 'none';
    } catch (err) {
      const t = I18N[lang];
      errMsg.textContent = t.camErrPrefix + err.message + t.camErrSuffix;
    }
  }
  startBtn.addEventListener('click', startCamera);

  // ---- Image loading ----
  loadBtn.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    overlayImg.onload = ()=>{
      overlayImg.style.display = 'block';
      const maxW = window.innerWidth * 0.7;
      const naturalW = overlayImg.naturalWidth;
      overlayImg.style.width = naturalW + 'px';
      state.scale = naturalW > 0 ? Math.min(1, maxW / naturalW) : 1;
      state.x = 0; state.y = 0; state.rotate = 0;
      applyTransform();
      imgLoaded = true;
      hint.style.display = 'block';
    };
    overlayImg.src = url;
  });

  // ---- Opacity ----
  opacitySlider.addEventListener('input', ()=>{
    overlayImg.style.opacity = (opacitySlider.value/100).toFixed(2);
  });
  overlayImg.style.opacity = 0.5;

  // ---- Lock (auto-hides the bar too, to maximize the camera view) ----
  lockBtn.addEventListener('click', ()=>{
    state.locked = !state.locked;
    applyLanguage();
    lockBtn.classList.toggle('active', state.locked);
    if(state.locked){
      collapseBar();
    }
  });

  // ---- Mirror ----
  flipBtn.addEventListener('click', ()=>{
    state.mirrored = !state.mirrored;
    flipBtn.classList.toggle('active', state.mirrored);
    applyTransform();
  });

  // ---- Hide/show bar ----
  function collapseBar(){
    bar.classList.add('hidden');
    peekTab.classList.add('show');
    hint.style.display = 'none';
  }
  function expandBar(){
    bar.classList.remove('hidden');
    peekTab.classList.remove('show');
  }
  hideBtn.addEventListener('click', collapseBar);
  peekTab.addEventListener('click', expandBar);

  // ---- Touch gestures: drag / pinch / rotate ----
  let startDist = 0, startAngle = 0, startScale = 1, startRotate = 0;
  let dragStart = null, dragOrigin = null;

  function dist(t1, t2){
    return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
  }
  function angle(t1, t2){
    return Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX) * 180 / Math.PI;
  }

  stage.addEventListener('touchstart', (e)=>{
    if(state.locked || !imgLoaded) return;
    if(e.touches.length === 1){
      dragStart = { x:e.touches[0].clientX, y:e.touches[0].clientY };
      dragOrigin = { x:state.x, y:state.y };
    } else if(e.touches.length === 2){
      startDist = dist(e.touches[0], e.touches[1]);
      startAngle = angle(e.touches[0], e.touches[1]);
      startScale = state.scale;
      startRotate = state.rotate;
    }
  }, {passive:true});

  stage.addEventListener('touchmove', (e)=>{
    if(state.locked || !imgLoaded) return;
    if(e.touches.length === 1 && dragStart){
      const dx = e.touches[0].clientX - dragStart.x;
      const dy = e.touches[0].clientY - dragStart.y;
      state.x = dragOrigin.x + dx;
      state.y = dragOrigin.y + dy;
      applyTransform();
    } else if(e.touches.length === 2){
      const d = dist(e.touches[0], e.touches[1]);
      const a = angle(e.touches[0], e.touches[1]);
      state.scale = Math.max(0.05, startScale * (d / startDist));
      state.rotate = startRotate + (a - startAngle);
      applyTransform();
    }
  }, {passive:true});

  stage.addEventListener('touchend', ()=>{ dragStart = null; }, {passive:true});

  window.addEventListener('resize', applyTransform);

  applyLanguage();
})();
</script>
</body>
</html>
