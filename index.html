  .screen,#landing,#cameraScreen{height:100dvh;min-height:100dvh}

.screen{height:var(--vvh,100dvh);min-height:var(--vvh,100dvh)}
.hero{
  width:min(88vw,430px); text-align:center; margin-top:-3vh;
  padding:28px 22px 30px; border-radius:30px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 18px 60px rgba(57,112,143,.10);
  backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
}
.logo{font-size:clamp(46px,13vw,72px);font-weight:760;letter-spacing:-3px;color:#4d87ad;line-height:1}
.logo span{font-weight:420;color:#5a6f7b}
.tagline{margin:12px 0 25px;color:#506a7b;font-size:15px;line-height:1.4}
.primary{
  width:100%;padding:16px 20px;border-radius:17px;
  background:#5f9fc2;color:white;font-weight:700;font-size:17px;
  box-shadow:0 9px 24px rgba(74,132,166,.23);
}
.primary:active{transform:scale(.98)}
.lang{
  display:flex;justify-content:center;gap:7px;margin-top:18px;
  font-size:13px;color:#587083;
}
.lang button{background:transparent;color:#587083;padding:7px 10px;border-radius:10px}
.lang button.active{background:rgba(255,255,255,.62);color:#355c73;font-weight:700}
.note{margin-top:13px;font-size:11px;color:#6d8490}
#cameraScreen{display:none;background:#000;height:100dvh;min-height:100dvh}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#overlay{
  position:absolute;left:50%;top:50%;width:48vw;max-width:430px;
  transform-origin:center center; user-select:none;-webkit-user-drag:none;
  pointer-events:auto;touch-action:none;display:none;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.12));
}
#topbar{
  position:absolute;top:env(safe-area-inset-top,12px);left:12px;right:12px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  z-index:10;transition:opacity .25s;
}
.pill{
  display:flex;align-items:center;gap:8px;padding:10px 13px;border-radius:16px;
  background:rgba(10,22,30,.68);color:#fff;border:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-size:13px;font-weight:600;
}
.status-dot{width:8px;height:8px;border-radius:50%;background:#72d99a}
#showBarButton{
  display:none;position:absolute;right:14px;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  z-index:12;cursor:pointer;
}
.controls-hidden #showBarButton{display:flex;align-items:center}
#controls{
  position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  z-index:10;border-radius:23px;padding:12px;
  background:var(--glass);color:#fff;border:1px solid var(--line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transition:transform .25s,opacity .25s;
}
.slider-row{display:flex;align-items:center;gap:11px;margin:0 3px 11px}
.slider-row label{font-size:13px;color:#dbe8ed;min-width:58px}
input[type=range]{flex:1;accent-color:#9bcfe4}
.control-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.control{
  min-height:48px;border-radius:14px;background:rgba(255,255,255,.09);
  color:#fff;font-size:12px;font-weight:650;padding:7px 4px;
}
.control:active{background:rgba(255,255,255,.18)}
.control .icon{display:block;font-size:18px;line-height:19px;margin-bottom:2px}
#hiddenHint{
  position:absolute;left:50%;top:calc(50% + 35px);transform:translate(-50%,-50%);
  color:rgba(255,255,255,.86);font-size:13px;text-align:center;z-index:5;
  background:rgba(0,0,0,.38);padding:9px 13px;border-radius:13px;
  pointer-events:none;
}
#permissionError{
  display:none;position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);
  padding:22px;border-radius:20px;background:rgba(20,25,28,.92);color:#fff;
  text-align:center;z-index:20;
}
#permissionError strong{display:block;margin-bottom:8px;font-size:18px}
#permissionError p{font-size:14px;line-height:1.45;color:#d4dde0}
#closeBtn{padding:8px 11px}
.locked #overlay{pointer-events:none}
.controls-hidden #controls{transform:translateY(130%);opacity:0}
.controls-hidden #topbar{opacity:.15}
@media (min-width:700px){
  .control-grid{grid-template-columns:repeat(4,minmax(100px,1fr))}
}
</style>
</head>
<body>
<section id="landing" class="screen">
  <div class="hero">
    <div class="logo">Trace<span>Cam</span></div>
    <div class="tagline" data-i18n="tagline">Project an image through your camera and trace it directly onto any surface.</div>
    <button class="primary" id="startBtn" data-i18n="enable">Enable Camera</button>
    <div class="lang" aria-label="Language">
      <button id="enBtn" class="active">English</button>
      <span>•</span>
      <button id="esBtn">Español</button>
    </div>
    <div class="note" data-i18n="secure">Camera access stays on your device.</div>
  </div>
</section>

<section id="cameraScreen" class="screen">
  <video id="video" autoplay playsinline muted></video>
  <img id="overlay" alt="Trace image">
  <div id="hiddenHint" data-i18n="hint">Load an image to begin tracing</div>

  <div id="topbar">
    <div class="pill"><span class="status-dot"></span><span id="modeText">TraceCam</span></div>
    <button class="pill" id="closeBtn" data-i18n="exit">Exit</button>
  </div>

  <button id="showBarButton" class="pill" data-i18n="show" aria-label="Show controls">⌃ &nbsp; Show Bar</button>

  <div id="controls">
    <div class="slider-row">
      <label data-i18n="opacity">Opacity</label>
      <input id="opacity" type="range" min="0.08" max="1" value="0.5" step="0.01" aria-label="Opacity">
      <span id="opacityValue">50%</span>
    </div>
    <div class="control-grid">
      <button class="control" id="loadBtn"><span class="icon">＋</span><span data-i18n="load">Load Image</span></button>
      <button class="control" id="lockBtn"><span class="icon">🔓</span><span data-i18n="lock">Lock</span></button>
      <button class="control" id="mirrorBtn"><span class="icon">↔</span><span data-i18n="mirror">Mirror</span></button>
      <button class="control" id="hideBtn"><span class="icon">⌄</span><span data-i18n="hide">Hide Bar</span></button>
    </div>
  </div>
  <input id="fileInput" type="file" accept="image/*" hidden tabindex="-1">
  <div id="permissionError">
    <strong data-i18n="cameraErrorTitle">Camera access needed</strong>
    <p data-i18n="cameraError">Please allow camera access in Safari. TraceCam needs the rear camera to project your reference image.</p>
    <button class="primary" id="retryBtn" data-i18n="retry">Try Again</button>
  </div>
</section>

<script>
const I18N = {
  en:{
    tagline:"Project an image through your camera and trace it directly onto any surface.",
    enable:"Enable Camera", secure:"Camera access stays on your device.", hint:"Load an image to begin tracing",
    exit:"Exit",opacity:"Opacity",load:"Load Image",lock:"Lock",unlock:"Unlock",mirror:"Mirror",hide:"Hide Bar",show:"Show Bar",
    cameraErrorTitle:"Camera access needed",cameraError:"Please allow camera access in Safari. TraceCam needs the rear camera to project your reference image.",
    retry:"Try Again",loaded:"Image loaded",locked:"Locked"
  },
  es:{
    tagline:"Proyecta una imagen con la cámara y calca el dibujo directamente sobre cualquier superficie.",
    enable:"Activar cámara",secure:"El acceso a la cámara permanece en tu dispositivo.",hint:"Carga una imagen para empezar a calcar",
    exit:"Salir",opacity:"Opacidad",load:"Cargar imagen",lock:"Bloquear",unlock:"Desbloquear",mirror:"Espejo",hide:"Ocultar barra",show:"Mostrar barra",
    cameraErrorTitle:"Se necesita acceso a la cámara",cameraError:"Permite el acceso a la cámara en Safari. TraceCam necesita la cámara trasera para proyectar tu imagen de referencia.",
    retry:"Intentar de nuevo",loaded:"Imagen cargada",locked:"Bloqueado"
  }
};
let lang = localStorage.getItem("tracecam-lang") || "en";
let stream = null, locked = false, mirrored = false;
let transform = {x:0,y:0,scale:1,rotation:0};
let gesture = null;

const $ = id => document.getElementById(id);
const landing=$("landing"), cameraScreen=$("cameraScreen"), video=$("video"), overlay=$("overlay");
const controls=$("controls"), hiddenHint=$("hiddenHint"), permissionError=$("permissionError");

function t(key){return I18N[lang][key] || I18N.en[key]}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  $("enBtn").classList.toggle("active",lang==="en"); $("esBtn").classList.toggle("active",lang==="es");
  $("lockBtn").querySelector("[data-i18n]").textContent=t(locked?"unlock":"lock");
  $("hideBtn").querySelector("[data-i18n]").textContent=document.body.classList.contains("controls-hidden")?t("show"):t("hide");
}
$("enBtn").onclick=()=>{lang="en";localStorage.setItem("tracecam-lang",lang);applyLang()};
$("esBtn").onclick=()=>{lang="es";localStorage.setItem("tracecam-lang",lang);applyLang()};

async function startCamera(){
  permissionError.style.display="none";
  try{
    if(stream) stream.getTracks().forEach(track=>track.stop());
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}
    });
    video.srcObject=stream;
    await video.play();
    landing.style.display="none"; cameraScreen.style.display="block";
    if(!overlay.src) hiddenHint.style.display="block";
  }catch(err){
    console.error(err);
    cameraScreen.style.display="block"; landing.style.display="none";
    permissionError.style.display="block";
  }
}
$("startBtn").onclick=startCamera;
$("retryBtn").onclick=startCamera;
$("closeBtn").onclick=()=>{
  if(stream) stream.getTracks().forEach(track=>track.stop());
  stream=null; cameraScreen.style.display="none"; landing.style.display="flex";
};
$("loadBtn").onclick=()=>$("fileInput").click();
$("fileInput").onchange=e=>{
  const file=e.target.files[0]; if(!file) return;
  const url=URL.createObjectURL(file);
  overlay.onload=()=>{
    overlay.style.display="block"; hiddenHint.style.display="none";
    fitImage(); URL.revokeObjectURL(url);
  };
  overlay.src=url;
};

function fitImage(){
  const maxW=Math.min(innerWidth*.70,520), maxH=innerHeight*.62;
  const ratio=Math.min(maxW/overlay.naturalWidth,maxH/overlay.naturalHeight);
  const w=overlay.naturalWidth*ratio;
  overlay.style.width=w+"px";
  transform={x:0,y:0,scale:1,rotation:0};
  renderTransform();
}
function renderTransform(){
  // Keep zoom perfectly proportional. Translation, rotation and scale are separate
  // operations so pinching never stretches or deforms the reference image.
  const signedScale = mirrored ? -transform.scale : transform.scale;
  const value = `translate3d(calc(-50% + ${transform.x}px), calc(-50% + ${transform.y}px), 0) rotate(${transform.rotation}deg) scale(${signedScale})`;
  overlay.style.transform = value;
  overlay.style.webkitTransform = value;
  overlay.style.opacity = $("opacity").value;
  overlay.style.transformOrigin = "center center";
  overlay.style.filter = "drop-shadow(0 1px 2px rgba(0,0,0,.12))";
}
$("opacity").oninput=e=>{
  $("opacityValue").textContent=Math.round(e.target.value*100)+"%"; renderTransform();
};
$("lockBtn").onclick=()=>{
  locked=!locked; document.body.classList.toggle("locked",locked);
  $("lockBtn").querySelector(".icon").textContent=locked?"🔒":"🔓"; applyLang();
};
$("mirrorBtn").onclick=()=>{mirrored=!mirrored;renderTransform()};
$("hideBtn").onclick=()=>{
  document.body.classList.add("controls-hidden");
  applyLang();
};
$("showBarButton").onclick=()=>{
  document.body.classList.remove("controls-hidden");
  applyLang();
};

function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
function angle(a,b){return Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX)*180/Math.PI}
overlay.addEventListener("touchstart",e=>{
  if(locked)return;
  e.preventDefault();

  if(e.touches.length===1){
    const p=e.touches[0];
    gesture={
      type:"drag",
      sx:p.clientX, sy:p.clientY,
      ox:transform.x, oy:transform.y
    };
  }else if(e.touches.length>=2){
    const a=e.touches[0],b=e.touches[1];
    gesture={
      type:"pinch",
      d:dist(a,b),
      a:angle(a,b),
      scale:transform.scale,
      rotation:transform.rotation
    };
  }
},{passive:false});
overlay.addEventListener("touchmove",e=>{
  if(locked||!gesture)return;
  e.preventDefault();

  // One finger = move only. No resizing.
  if(e.touches.length===1 && gesture.type==="drag"){
    const p=e.touches[0];
    transform.x=gesture.ox+(p.clientX-gesture.sx);
    transform.y=gesture.oy+(p.clientY-gesture.sy);
  }

  // Two fingers = uniform pinch zoom + rotation. Never change width/height independently.
  else if(e.touches.length>=2){
    const a=e.touches[0],b=e.touches[1];
    const d=dist(a,b), ang=angle(a,b);

    if(gesture.type!=="pinch"){
      gesture={
        type:"pinch",
        d:d,
        a:ang,
        scale:transform.scale,
        rotation:transform.rotation
      };
    }

    const ratio=d/gesture.d;
    transform.scale=Math.max(.18,Math.min(6,gesture.scale*ratio));

    let delta=ang-gesture.a;
    if(delta>180)delta-=360;
    if(delta<-180)delta+=360;
    transform.rotation=gesture.rotation+delta;
  }

  renderTransform();
},{passive:false});
overlay.addEventListener("touchend",e=>{
  if(locked)return;
  if(e.touches.length===0){gesture=null}
  else if(e.touches.length===1){
    const p=e.touches[0];
    gesture={type:"drag",sx:p.clientX,sy:p.clientY,ox:transform.x,oy:transform.y};
  }
},{passive:false});

function syncViewport(){
  // Keep the app surface aligned with iOS Safari's visible viewport.
  // This prevents the controls from being visually above their actual hit area.
  const vv = window.visualViewport;
  if(!vv) return;
  document.documentElement.style.setProperty("--vvh", vv.height + "px");
  document.documentElement.style.setProperty("--vvtop", vv.offsetTop + "px");
}

window.addEventListener("resize",()=>{
  syncViewport();
  if(overlay.style.display==="block") renderTransform();
});
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",syncViewport);
  window.visualViewport.addEventListener("scroll",syncViewport);
}
syncViewport();
document.addEventListener("visibilitychange",()=>{
  if(document.hidden && stream) stream.getTracks().forEach(track=>track.enabled=false);
  else if(stream) stream.getTracks().forEach(track=>track.enabled=true);
});
applyLang();
</script>
